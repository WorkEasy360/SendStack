services:
  postgres:
    image: postgres:16-alpine
    ports:
    - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-multisender}
      POSTGRES_USER: ${DB_USER:-multisender}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-multisender}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: only needed for the QR/device-linking connection method
  # (Normal WhatsApp / WhatsApp Business App). Cloud API accounts work
  # without it. Leave QR_PROVIDER_API_KEY/WEBHOOK_SECRET unset in .env and
  # this container will simply fail its own healthcheck and restart-loop in
  # isolation -- it does not block `backend` or anything else from starting.
  qr-bridge:
    build:
      context: ./qr-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    # Published so a Django server run outside Docker (e.g. `manage.py
    # runserver` for local frontend dev against Vite) can still reach it at
    # QR_PROVIDER_BASE_URL=http://localhost:4001 -- containers on the
    # internal Docker network keep using qr-bridge:4001 regardless.
    ports:
      - "4001:4001"
    environment:
      QR_PROVIDER_API_KEY: ${QR_PROVIDER_API_KEY:-}
      QR_PROVIDER_WEBHOOK_SECRET: ${QR_PROVIDER_WEBHOOK_SECRET:-}
      WHATSAPP_QR_SESSION_TTL_SECONDS: ${WHATSAPP_QR_SESSION_TTL_SECONDS:-99999999999999999999}
    volumes:
      - qr_bridge_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QR_PROVIDER_BASE_URL: http://qr-bridge:4001
      # qr-bridge calls this back over the internal Docker network to
      # deliver webhooks -- not the public site URL, so pairing/message
      # delivery never depends on nginx/public DNS/TLS being reachable.
      BACKEND_PUBLIC_URL: http://backend:8000
      # An uploaded attachment is fetched by whatever sends it, not by the
      # browser: Baileys downloads the link from inside qr-bridge, where
      # "localhost" means qr-bridge itself. So the link is stored with the
      # public origin (what a person clicks in the inbox) and rewritten to the
      # internal one at the moment it is handed to the provider.
      # Set MEDIA_PUBLIC_BASE_URL in .env to the real site origin once this is
      # served on a domain -- Cloud API sends need it reachable publicly.
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost}
      MEDIA_INTERNAL_BASE_URL: http://nginx
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  qr_bridge_data:
