{# Inline styles and a table for the button, for the same reason as
   accounts/_base_email.html: mail clients strip <style> and ignore flexbox. #}
<div style="margin:0;padding:24px 12px;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;border:1px solid #e7e5e4;">
    <p style="margin:0 0 24px;font-size:18px;font-weight:600;color:#1c1917;">{{ product_name }}</p>

    <p style="margin:0 0 12px;font-size:16px;font-weight:600;color:#1c1917;">{{ title }}</p>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#292524;">{{ body }}</p>

    {% if plan_name or trial_ends_on or period_ends_on %}
    <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;margin:0 0 20px;font-size:13px;color:#57534e;">
      {% if plan_name %}<tr><td style="padding:4px 0;">Plan</td><td style="padding:4px 0;text-align:right;color:#1c1917;">{{ plan_name }}</td></tr>{% endif %}
      {% if trial_ends_on %}<tr><td style="padding:4px 0;">Trial ends</td><td style="padding:4px 0;text-align:right;color:#1c1917;">{{ trial_ends_on }}</td></tr>{% endif %}
      {% if period_ends_on %}<tr><td style="padding:4px 0;">Current period ends</td><td style="padding:4px 0;text-align:right;color:#1c1917;">{{ period_ends_on }}</td></tr>{% endif %}
    </table>
    {% endif %}

    {% if action_url %}
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px;">
      <tr><td style="border-radius:8px;background:#059669;">
        <a href="{{ action_url }}" style="display:inline-block;padding:11px 20px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">Manage your plan</a>
      </td></tr>
    </table>
    {% endif %}

    <hr style="border:none;border-top:1px solid #e7e5e4;margin:28px 0 16px;">
    <p style="margin:0;font-size:12px;line-height:1.6;color:#78716c;">
      {% if support_email %}Need help? Email <a href="mailto:{{ support_email }}" style="color:#059669;">{{ support_email }}</a>.{% endif %}
      {% if support_url %}{% if support_email %}<br>{% endif %}Support: <a href="{{ support_url }}" style="color:#059669;">{{ support_url }}</a>.{% endif %}
      <br>This message was sent to the {{ product_name }} workspace this account belongs to.
    </p>
  </div>
</div>
