{# Inline styles only, and a table for the button. Every mail client strips
   <style> blocks or ignores them; the ones that do not still refuse flexbox.
   Plain, wide-support HTML is what actually renders in Gmail and Outlook. #}
<div style="margin:0;padding:24px 12px;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;border:1px solid #e7e5e4;">
    <p style="margin:0 0 24px;font-size:18px;font-weight:600;color:#1c1917;">{{ product_name }}</p>
    {% block content %}{% endblock %}
    <hr style="border:none;border-top:1px solid #e7e5e4;margin:28px 0 16px;">
    <p style="margin:0;font-size:12px;line-height:1.6;color:#78716c;">
      {% if support_email %}Need help? Email <a href="mailto:{{ support_email }}" style="color:#059669;">{{ support_email }}</a>.{% endif %}
      {% if support_url %}{% if support_email %}<br>{% endif %}Support: <a href="{{ support_url }}" style="color:#059669;">{{ support_url }}</a>.{% endif %}
      {% if not support_email and not support_url %}This is an automated message about your account.{% endif %}
      <br>This message was sent to the address on the {{ product_name }} account <strong>{{ username }}</strong>.
    </p>
  </div>
</div>
