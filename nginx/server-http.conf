# Plain HTTP. Installed as conf.d/10-app.conf when there is no certificate on
# disk yet -- which is the state of every deployment between "docker compose
# up" and the first successful certbot run, and the permanent state of a
# deployment behind something else that terminates TLS (Cloudflare, an Oracle
# load balancer).
#
# This is byte-for-byte the behaviour the stack had before TLS existed, so
# nothing about a first boot changes: the site comes up on port 80 and works.
# The only addition is the ACME challenge location, which has to be reachable
# over http for certbot to be able to issue the certificate that then switches
# this file out for server-tls.conf.
#
# IMPORTANT: while this layout is active, SECURE_SSL_REDIRECT must be false in
# .env. Django defaults it to true, and true here means every request redirects
# to an https port nothing is listening on. See docs/DEPLOY.md.

server {
    listen 80;
    server_name _;

    # --- ACME http-01 challenge ---------------------------------------
    #
    # certbot writes its proof token into this webroot (a volume shared with
    # the certbot container) and Let's Encrypt fetches it back over port 80.
    # `^~` so it wins against the SPA catch-all without regex evaluation --
    # otherwise try_files would answer the validation request with index.html
    # and issuance would fail with a "wrong content" error that reads as a DNS
    # problem.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # The container's own HEALTHCHECK target. Answered by nginx itself so it
    # reports on nginx rather than on the backend -- the backend has its own
    # healthcheck, and a proxy that marks itself unhealthy because its
    # upstream is down takes the whole stack out of service instead of
    # serving the SPA and the 502.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    include /etc/nginx/app/locations.conf;
}
