# The application itself: every location that serves or proxies something.
#
# Included from inside a `server { }` block by both server-http.conf and
# server-tls.conf, so that turning TLS on cannot change routing behaviour.
# There is no second copy to keep in sync -- an edit here applies to whichever
# layout the container happens to be running.
#
# Nothing in this file names a scheme or a port. `$scheme` in the
# X-Forwarded-Proto headers below resolves to "http" or "https" according to
# which server block did the including, which is exactly what Django's
# SECURE_PROXY_SSL_HEADER needs to see (config/settings/production.py).

client_max_body_size 20M;

location /static/ {
    alias /static/;
}

# --- Uploaded attachments ------------------------------------------
#
# /media/ is served straight off disk, which means it never passes through
# Django's SecurityMiddleware and gets none of the response headers the
# rest of the site does. Everything under here is a file somebody uploaded,
# on the application's own origin, so without these headers an upload that
# a browser is willing to treat as a document is stored XSS against every
# logged-in user. core.uploads is the other half of this: it keeps such
# files from being stored in the first place. Both, because either one
# alone is a single point of failure.
#
# nosniff stops a browser second-guessing the Content-Type; the CSP means
# that even a response somehow rendered as a document can load, run and
# reach nothing; and `sandbox` drops it into an opaque origin so it cannot
# touch this one's cookies or storage.

# The formats the product actually renders inline -- the inbox thread's
# <img>/<video>/<audio>, and the composer's preview of the picker. Listed
# explicitly rather than allowing inline display of arbitrary uploads, and
# matching the image/video/audio half of core.uploads' allowlist. A regex
# location wins over the /media/ prefix below, so anything not named here
# falls through to being a download.
#
# Every add_header has to be repeated here: a location that sets any
# header of its own inherits none from its parent.
location ~* ^/media/.+\.(jpe?g|png|gif|webp|mp4|m4v|mov|3gp|webm|mkv|mp3|m4a|aac|ogg|opus|wav|amr)$ {
    root /;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Disposition "inline" always;
    add_header Strict-Transport-Security $hsts_header always;
}

# Everything else: handed over as a download, never rendered. Documents,
# CSV imports, knowledge-base uploads -- and anything that reached the
# volume before core.uploads existed.
location /media/ {
    alias /media/;
    # An unknown extension is bytes, not a guess at a type.
    default_type application/octet-stream;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Disposition "attachment" always;
    add_header Strict-Transport-Security $hsts_header always;
}

# The inbox's live event stream. Buffering here would hold each event
# until nginx felt like flushing, which for Server-Sent Events means the
# updates arrive in a clump minutes late -- worse than not having them.
location /api/v1/realtime/stream/ {
    proxy_pass http://backend:8000/api/v1/realtime/stream/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 700s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The Django admin. Rate-limited here as well as in Django (see
# core.middleware.AdminSecurityMiddleware) because this is the cheapest
# place to stop a password-spraying run: the requests are dropped before
# a worker, a database connection or an Argon2 hash is spent on them.
# 20 requests/minute with a burst of 10 is far more than a person
# administering the site ever needs and far less than a guessing script
# wants.
location /admin/ {
    limit_req zone=ms_admin burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Short links a contact taps in WhatsApp. Kept at the root, above the
# SPA catch-all, so /r/<code> reaches Django instead of being answered
# with index.html.
location /r/ {
    proxy_pass http://backend:8000/r/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Click-to-chat links and the embeddable website button. Public and
# unauthenticated, and above the SPA catch-all for the same reason /r/ is.
location /c/ {
    proxy_pass http://backend:8000/c/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /w/ {
    proxy_pass http://backend:8000/w/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The phone carrier's callbacks during a live call. Above the SPA
# catch-all for the same reason /r/ is: without this, Twilio would be
# answered with index.html instead of TwiML and every call would fail.
# The read timeout is longer than a turn's own budget so nginx is never
# the thing that gives up first -- Twilio's own 15s limit should be.
location /voice/ {
    proxy_pass http://backend:8000/voice/;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /health/ {
    proxy_pass http://backend:8000/health/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- The built SPA ---------------------------------------------------
#
# Vite writes a content hash into every filename under /assets/, so a
# given URL's bytes can never change: a new build is a new filename. That
# makes these the one thing on the site it is safe to cache hard, and
# `immutable` is the half that matters -- without it a browser still sends
# a conditional request per asset on every reload, which on this app is
# thirty round trips before anything renders, each one paying the full
# latency of the connection to say "unchanged".
location /assets/ {
    root /usr/share/nginx/html;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security $hsts_header always;
}

location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    # index.html is the opposite case and must never be cached: it is the
    # only file naming the hashed bundles above, so a stale copy pins a
    # browser to the previous deploy's assets indefinitely. `no-cache`
    # still allows a 304 -- it means "revalidate", not "do not store".
    add_header Cache-Control "no-cache" always;

    # The first response a new visitor ever gets. If HSTS is going to be
    # emitted anywhere by nginx, it has to be here.
    add_header Strict-Transport-Security $hsts_header always;
}
