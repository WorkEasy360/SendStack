# HTTPS. Installed as conf.d/10-app.conf by docker-entrypoint.sh once, and
# only once, a certificate for ${DOMAIN} actually exists on disk. Installing
# it unconditionally would be a boot loop: nginx refuses to start when
# `ssl_certificate` names a file that is not there, so a stack configured for
# TLS before issuance would never come up -- and port 80 would never be
# reachable, which is precisely what certbot needs in order to issue the
# certificate. Hence the entrypoint check.
#
# ${DOMAIN} is substituted at container start by envsubst, restricted to that
# one variable so nginx's own $host / $scheme / $request_uri survive intact.

# --- Port 80: redirect, plus the two things that must not be redirected ---
server {
    listen 80;
    server_name ${DOMAIN};

    # Renewal uses the same http-01 challenge as issuance, every 60 days,
    # for as long as this deployment lives. Redirecting it to https would
    # work today and break the first time a certificate expires, which is
    # the least convenient moment to discover it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Deliberately served rather than redirected.
    #
    # docs/RELEASE_RUNBOOK.md and deploy.sh both verify a release with
    # `curl -sf localhost/health/ready/` from the host. Over a redirect that
    # becomes a request to https://localhost, whose certificate is for
    # ${DOMAIN} and therefore fails verification -- so the deploy's own
    # health gate would fail on a stack that is perfectly healthy.
    #
    # These endpoints expose liveness and dependency reachability, not data;
    # the ones that do expose data (/health/operations/, /health/backups/)
    # require a bearer token in Django regardless of which port they arrived
    # on.
    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else. `location /` rather than a server-level `return`,
    # because a server-level return fires before location matching and would
    # swallow the ACME challenge above.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443: the application ---------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # --- TLS parameters --------------------------------------------------
    #
    # Written out here rather than `include`d from certbot's
    # options-ssl-nginx.conf. That file is installed by certbot's *nginx*
    # plugin; this deployment uses `certonly --webroot`, which does not
    # install it -- so the include would be a missing-file error on first
    # boot, i.e. the boot loop this whole file is arranged to avoid.
    #
    # TLS 1.2 is kept alongside 1.3 because WhatsApp Cloud API and Razorpay
    # both call this host's webhooks, and a webhook sender is not a browser
    # you can ask to upgrade.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:MozSSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling saves every visitor a round trip to Let's Encrypt's
    # responder before the page can render. chain.pem is written by certbot
    # next to the certificate.
    ssl_stapling         on;
    ssl_stapling_verify  on;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;
    resolver             127.0.0.11 valid=30s;
    resolver_timeout     5s;

    # Server-level default. Locations that declare add_header of their own
    # inherit nothing, so the four that do repeat this line themselves --
    # see locations.conf.
    add_header Strict-Transport-Security $hsts_header always;

    include /etc/nginx/app/locations.conf;
}
