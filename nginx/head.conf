# http-context directives. Loaded as conf.d/00-head.conf, ahead of the server
# block in 10-app.conf, because a `limit_req_zone` must be declared before the
# `limit_req` that names it.
#
# This file is split out of what used to be a single nginx.conf for one
# reason: with TLS there are now two possible server layouts (plain :80, or
# :80-redirect plus :443) and exactly one of them is installed at container
# start by docker-entrypoint.sh. Everything that is true regardless of which
# one wins lives here, so it is never duplicated and cannot drift.

# --- Compression -----------------------------------------------------
#
# The stock nginx.conf ships `#gzip on;` commented out, and nothing here ever
# turned it on, so every asset and every API response went over the wire raw:
# a 231 kB entry bundle, 98 kB of icons and 59 kB of CSS on the critical path
# of a cold load, plus every JSON list response. Text compresses about 4x, so
# this is the single largest thing that can be done for how quickly the app
# appears -- and it costs one directive.
#
# `gzip_proxied any` matters because the API responses are proxied from
# Django: without it nginx declines to compress anything carrying the request
# headers a proxy pass adds, which is all of /api/.
#
# text/html is compressed by default and must not be listed in gzip_types --
# nginx warns about the duplicate. `gzip_min_length` keeps us from spending
# CPU (and three extra header bytes) on responses too small to gain.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   256;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    application/rss+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Brute-force protection for the Django admin, applied at the edge so an
# attacker never reaches Django's login view often enough to matter. This file
# is included from inside nginx.conf's `http` block, so a zone declared here is
# in the right context. 10m holds roughly 160k distinct client addresses.
limit_req_zone $binary_remote_addr zone=ms_admin:10m rate=20r/m;

# --- HSTS, as a variable ---------------------------------------------
#
# Django sets Strict-Transport-Security on its own responses
# (SECURE_HSTS_SECONDS in config/settings/production.py), but nginx answers
# index.html, /assets/ and /media/ without ever consulting Django -- and
# index.html is what a first-time visitor actually loads. Without this, the
# one response that matters most for pinning the origin to https is the one
# response that does not carry the header.
#
# It is a `map` rather than a literal because locations.conf is shared with
# the plain-HTTP layout, where the header is meaningless. nginx omits an
# add_header whose value evaluates to the empty string, so the same line is
# correct in both: it emits the header over https and nothing over http.
# (Browsers ignore HSTS delivered over http in any case; this keeps it honest
# rather than relying on that.)
#
# The value matches Django's exactly -- max-age one year, includeSubDomains,
# preload -- so the two can never disagree about the commitment being made.
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains; preload";
    default "";
}
