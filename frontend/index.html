<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!--
      The closed default for crawlers.

      This one file is served for every route, including the thirty behind the
      login, so the tag that ships with it is the tag an unauthenticated fetch
      of /campaigns/42 sees. Public pages opt in by calling the useSeo hook
      with index:true, and it puts this back when they unmount. See
      src/hooks/useSeo.js for why the default lives here rather than in a
      route-level effect.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Send WhatsApp campaigns to contacts who opted in, answer replies in a shared inbox, and see what happened."
    />
    <meta property="og:site_name" content="SendStack" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SendStack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
